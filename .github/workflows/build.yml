name: Build iOS app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Identify Apple toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "xcode=$(xcodebuild -version | tr '\n ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .bootstrap/downloads
            .bootstrap/receipts
            Vendor
          key: dependencies-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Documentation/Dependencies.lock.json', 'Resources/Models/model-manifest.json', 'Resources/LanguagePacks/_english/model-manifest.json', 'Tools/bootstrap.py', 'Tools/prepare*.py') }}
      - name: Restore, test, build and verify offline resources
        run: bash build.sh --test
